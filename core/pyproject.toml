[project]
name = "alien-trade-core"
version = "0.1.0"
description = "Strategy + signals + backtest/sim engine — shared by sim and live"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "eth-account>=0.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # ── Live runtime (Step 5) ──
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "qrcode>=7.4",
    "textual>=8.0",
    # ── x402 pay-per-call (metered CMC data access) ──
    "x402[evm,httpx]>=2.12",
]

[tool.hatch.build.targets.wheel]
packages = ["backtest", "signals", "strategy", "exec", "risk", "data", "config", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit test",
    "integration: integration test",
]

[tool.ruff]
line-length = 100
