<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" role="img" aria-label="System diagram. A LangGraph model layer of four agents sits at the top, marked advisory only, joined to the rest by dashed lines. Below it the deterministic Python core runs four signals into a regime detector, a signal combiner and a risk engine, which emits the order. The order goes to the swap executor, then to BSC mainnet, Convex and the cockpit.">
  <title>Alien-Trade architecture</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #fcfcfb; }
    .title { font-size: 19px; font-weight: 600; fill: #0b0b0b; }
    .sub { font-size: 13px; fill: #52514e; }
    .band-title { font-size: 13.5px; font-weight: 650; fill: #0b0b0b; }
    .band-note { font-size: 11.5px; fill: #52514e; }
    .box-title { font-size: 12.5px; font-weight: 550; fill: #0b0b0b; }
    .box-sub { font-size: 10.5px; fill: #52514e; }
    .edge-label { font-size: 11px; fill: #52514e; }

    .band-core { fill: #f0f6fd; stroke: #2a78d6; stroke-width: 1.5; }
    .band-model { fill: #f5f4f0; stroke: #a9a8a2; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: #fcfcfb; stroke: #d5d4cf; stroke-width: 1; }
    .box-core { fill: #ffffff; stroke: #9ec5f4; stroke-width: 1; }
    .box-key { fill: #e3eefb; stroke: #2a78d6; stroke-width: 1.5; }

    .flow { stroke: #0b0b0b; stroke-width: 1.8; fill: none; }
    .flow-dash { stroke: #a9a8a2; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #0b0b0b; }
    .head-dash { fill: #a9a8a2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .title, .band-title, .box-title { fill: #ffffff; }
      .sub, .band-note, .box-sub, .edge-label { fill: #c3c2b7; }
      .band-core { fill: #16202b; stroke: #3987e5; }
      .band-model { fill: #232320; stroke: #6b6a64; }
      .box { fill: #1f1f1d; stroke: #3d3d38; }
      .box-core { fill: #202b38; stroke: #2f5b8a; }
      .box-key { fill: #1d2f45; stroke: #3987e5; }
      .flow { stroke: #ffffff; }
      .head { fill: #ffffff; }
      .flow-dash { stroke: #6b6a64; }
      .head-dash { fill: #6b6a64; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="636"/>

  <text class="title" x="24" y="32">The trade path, and everything sitting beside it</text>
  <text class="sub" x="24" y="54">Solid lines are the path a buy or a sell travels. Dashed lines are advice, and every one of them is allowed to fail.</text>

  <!-- ================= MODEL LAYER ================= -->
  <rect class="band-model" x="60" y="76" width="776" height="104" rx="4"/>
  <text class="band-title" x="76" y="99">Model layer — LangGraph supervisor</text>
  <text class="band-note" x="320" y="99">advisory only · never returns a buy or a sell · trading continues without it</text>

  <rect class="box" x="76" y="112" width="180" height="54" rx="3"/>
  <text class="box-title" x="86" y="131">Researcher</text>
  <text class="box-sub" x="86" y="147">explains the regime, after</text>
  <text class="box-sub" x="86" y="160">the detector already decided</text>

  <rect class="box" x="264" y="112" width="180" height="54" rx="3"/>
  <text class="box-title" x="274" y="131">Strategist</text>
  <text class="box-sub" x="274" y="147">synthesis and the operator</text>
  <text class="box-sub" x="274" y="160">chat in the cockpit</text>

  <rect class="box" x="452" y="112" width="180" height="54" rx="3"/>
  <text class="box-title" x="462" y="131">Reflector</text>
  <text class="box-sub" x="462" y="147">writes a lesson into vector</text>
  <text class="box-sub" x="462" y="160">memory when a trade closes</text>

  <rect class="box" x="640" y="112" width="180" height="54" rx="3"/>
  <text class="box-title" x="650" y="131">Historian</text>
  <text class="box-sub" x="650" y="147">“have we lost on this</text>
  <text class="box-sub" x="650" y="160">setup before?”</text>

  <!-- advisory arrow down into the core -->
  <path class="flow-dash" d="M 300 180 L 300 203"/>
  <polygon class="head-dash" points="300,210 296,201 304,201"/>
  <text class="edge-label" x="314" y="199">explanations · reflections · chat</text>

  <!-- Historian feedback, round the right margin into the risk engine -->
  <path class="flow-dash" d="M 812 166 L 812 204 L 856 204 L 856 380 L 829 380"/>
  <polygon class="head-dash" points="820,380 829,376 829,384"/>
  <text class="edge-label" x="800" y="196" text-anchor="end">optional input to sizing — falls back if down</text>

  <!-- ================= CORE ================= -->
  <rect class="band-core" x="60" y="210" width="776" height="250" rx="4"/>
  <text class="band-title" x="76" y="233">/core — deterministic Python</text>
  <text class="band-note" x="272" y="233">the same code in backtest and in live trading · same input, same answer, every time</text>

  <rect class="box-core" x="76" y="246" width="180" height="42" rx="3"/>
  <text class="box-title" x="86" y="265">S1 Momentum</text>
  <text class="box-sub" x="86" y="280">price and trend</text>

  <rect class="box-core" x="264" y="246" width="180" height="42" rx="3"/>
  <text class="box-title" x="274" y="265">S2 Derivatives</text>
  <text class="box-sub" x="274" y="280">funding · open interest</text>

  <rect class="box-core" x="452" y="246" width="180" height="42" rx="3"/>
  <text class="box-title" x="462" y="265">S3 Sentiment</text>
  <text class="box-sub" x="462" y="280">market mood</text>

  <rect class="box-core" x="640" y="246" width="180" height="42" rx="3"/>
  <text class="box-title" x="650" y="265">S4 On-chain flow</text>
  <text class="box-sub" x="650" y="280">net flow</text>

  <path class="flow" d="M 300 288 L 300 297"/>
  <polygon class="head" points="300,304 296,295 304,295"/>

  <rect class="box-core" x="76" y="304" width="372" height="38" rx="3"/>
  <text class="box-title" x="86" y="328">RegimeDetector</text>
  <text class="box-sub" x="230" y="328">which market are we in right now</text>

  <path class="flow" d="M 448 323 L 457 323"/>
  <polygon class="head" points="464,323 455,319 455,327"/>

  <rect class="box-core" x="464" y="304" width="356" height="38" rx="3"/>
  <text class="box-title" x="474" y="328">SignalCombiner</text>
  <text class="box-sub" x="600" y="328">one score out of the four signals</text>

  <path class="flow" d="M 650 342 L 650 351"/>
  <polygon class="head" points="650,358 646,349 654,349"/>

  <rect class="box-key" x="76" y="358" width="744" height="44" rx="3"/>
  <text class="box-title" x="88" y="378">RiskEngine</text>
  <text class="box-sub" x="88" y="394">hold cash by default · token allowlist · equity floor · cumulative exposure cap · volatility-targeted sizing · kill switch</text>

  <path class="flow" d="M 456 402 L 456 409"/>
  <polygon class="head" points="456,416 452,407 460,407"/>

  <rect class="box-key" x="356" y="416" width="200" height="30" rx="3"/>
  <text class="box-title" x="456" y="436" text-anchor="middle">Order</text>

  <!-- ================= EXECUTION ================= -->
  <path class="flow" d="M 456 460 L 456 469"/>
  <polygon class="head" points="456,476 452,467 460,467"/>

  <rect class="box" x="60" y="476" width="776" height="48" rx="4"/>
  <text class="box-title" x="76" y="498">TwakSwapExecutor — simulate → sign → send</text>
  <text class="box-sub" x="76" y="514">Trust Wallet Agent Kit. No private key in the code, the logs, or the environment of any process that talks to the network.</text>

  <path class="flow" d="M 180 524 L 180 537"/>
  <polygon class="head" points="180,544 176,535 184,535"/>

  <!-- ================= STATE AND UI ================= -->
  <rect class="box" x="60" y="544" width="240" height="52" rx="3"/>
  <text class="box-title" x="72" y="566">BSC mainnet</text>
  <text class="box-sub" x="72" y="582">on-chain receipt</text>

  <path class="flow" d="M 300 570 L 321 570"/>
  <polygon class="head" points="328,570 319,566 319,574"/>

  <rect class="box" x="328" y="544" width="240" height="52" rx="3"/>
  <text class="box-title" x="340" y="566">Convex — real-time state</text>
  <text class="box-sub" x="340" y="582">trades · decisions · ledger · audit</text>

  <path class="flow" d="M 568 570 L 589 570"/>
  <polygon class="head" points="596,570 587,566 587,574"/>

  <rect class="box" x="596" y="544" width="240" height="52" rx="3"/>
  <text class="box-title" x="608" y="566">Glass Cockpit</text>
  <text class="box-sub" x="608" y="582">React + Vite PWA</text>

  <text class="sub" x="24" y="622">Put a model on the solid path and the same input stops giving the same answer — at which point nothing above can be backtested.</text>
</svg>
