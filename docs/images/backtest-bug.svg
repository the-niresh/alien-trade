<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" role="img" aria-label="Two panels. Before the fix: the engine clamped the position to zero but credited cash for the full requested sell, creating money out of nothing and reporting plus 452 percent. After the fix: the engine refuses the impossible fill, counts the refusal, and the same strategy reports minus 16 percent.">
  <title>The backtest was lying in my favour</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: #fcfcfb; }
    .title { font-size: 19px; font-weight: 600; fill: #0b0b0b; }
    .sub { font-size: 13px; fill: #52514e; }
    .panel-head { font-size: 13px; font-weight: 650; fill: #0b0b0b; }
    .box-text { font-size: 12px; fill: #0b0b0b; }
    .line { font-size: 11.5px; fill: #52514e; }
    .line-key { font-size: 11.5px; font-weight: 600; fill: #0b0b0b; }
    .headline { font-size: 13px; font-weight: 650; fill: #0b0b0b; }
    .foot { font-size: 11.5px; fill: #52514e; }

    .panel { fill: #fcfcfb; stroke: #d5d4cf; stroke-width: 1; }
    .box { fill: #f5f4f0; stroke: #d5d4cf; stroke-width: 1; }
    .strip-before { fill: #fbe9e0; stroke: #eb6834; stroke-width: 1.5; }
    .strip-after { fill: #e3eefb; stroke: #2a78d6; stroke-width: 1.5; }
    .bar-before { fill: #eb6834; }
    .bar-after { fill: #2a78d6; }
    .flow { stroke: #0b0b0b; stroke-width: 1.8; fill: none; }
    .head { fill: #0b0b0b; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .title, .panel-head, .box-text, .line-key, .headline { fill: #ffffff; }
      .sub, .line, .foot { fill: #c3c2b7; }
      .panel { fill: #1f1f1d; stroke: #3d3d38; }
      .box { fill: #272724; stroke: #3d3d38; }
      .strip-before { fill: #3a1f13; stroke: #d95926; }
      .strip-after { fill: #1d2f45; stroke: #3987e5; }
      .bar-before { fill: #d95926; }
      .bar-after { fill: #3987e5; }
      .flow { stroke: #ffffff; }
      .head { fill: #ffffff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="404"/>

  <text class="title" x="24" y="32">The backtest was lying in my favour</text>
  <text class="sub" x="24" y="54">Three silent bugs, every one of them inflating the result. No exception, no failing test, no warning. This is the worst of them.</text>

  <!-- ============ BEFORE ============ -->
  <rect class="panel" x="24" y="82" width="414" height="274" rx="4"/>
  <rect class="bar-before" x="40" y="96" width="4" height="14"/>
  <text class="panel-head" x="52" y="108">before — the bug</text>

  <rect class="box" x="40" y="120" width="186" height="38" rx="3"/>
  <text class="box-text mono" x="52" y="144">holds 3 ETH</text>
  <rect class="box" x="236" y="120" width="186" height="38" rx="3"/>
  <text class="box-text mono" x="248" y="144">cash $1,000</text>

  <path class="flow" d="M 231 158 L 231 169"/>
  <polygon class="head" points="231,176 227,167 235,167"/>

  <rect class="box" x="40" y="176" width="382" height="32" rx="3"/>
  <text class="box-text mono" x="52" y="197">strategy asks: sell 10 ETH</text>

  <path class="flow" d="M 231 208 L 231 219"/>
  <polygon class="head" points="231,226 227,217 235,217"/>

  <rect class="strip-before" x="40" y="226" width="382" height="72" rx="3"/>
  <text class="line" x="52" y="247">position clamped to 0 — correct</text>
  <text class="line-key" x="52" y="266">cash credited for the full 10 ETH — not correct</text>
  <text class="line" x="52" y="285">the 7 ETH it never held became cash out of nothing</text>

  <text class="headline" x="40" y="322">reported +452%, max drawdown 0.45%</text>
  <text class="line" x="40" y="341">$46,814 of imaginary cash over 540 days of ETH</text>

  <!-- ============ AFTER ============ -->
  <rect class="panel" x="462" y="82" width="414" height="274" rx="4"/>
  <rect class="bar-after" x="478" y="96" width="4" height="14"/>
  <text class="panel-head" x="490" y="108">after — the fix</text>

  <rect class="box" x="478" y="120" width="186" height="38" rx="3"/>
  <text class="box-text mono" x="490" y="144">holds 3 ETH</text>
  <rect class="box" x="674" y="120" width="186" height="38" rx="3"/>
  <text class="box-text mono" x="686" y="144">cash $1,000</text>

  <path class="flow" d="M 669 158 L 669 169"/>
  <polygon class="head" points="669,176 665,167 673,167"/>

  <rect class="box" x="478" y="176" width="382" height="32" rx="3"/>
  <text class="box-text mono" x="490" y="197">strategy asks: sell 10 ETH</text>

  <path class="flow" d="M 669 208 L 669 219"/>
  <polygon class="head" points="669,226 665,217 673,217"/>

  <rect class="strip-after" x="478" y="226" width="382" height="72" rx="3"/>
  <text class="line-key" x="490" y="247">the fill is refused — it cannot sell what it does not hold</text>
  <text class="line" x="490" y="266">the refusal is counted on BacktestResult</text>
  <text class="line" x="490" y="285">the count is printed in every evaluation run</text>

  <text class="headline" x="478" y="322">actual −16%</text>
  <text class="line" x="478" y="341">180 of 180 sells had been asking for more than it held</text>

  <text class="foot" x="24" y="380">core/tests/test_accounting_integrity.py pins all three. I checked that it fails on the old code — that is the only thing that makes writing a regression test worth anything.</text>
</svg>
